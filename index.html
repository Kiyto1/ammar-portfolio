<!doctype html>
<html lang="ar" dir="rtl" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عمار الصاعدي | مطوّر تطبيقات ويب متكاملة</title>
    <script>
      // Apply saved language and theme before first paint to avoid a flash.
      (function () {
        try {
          var r = document.documentElement;
          var lang = localStorage.getItem("lang") === "en" ? "en" : "ar";
          var theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          r.lang = lang;
          r.dir = lang === "ar" ? "rtl" : "ltr";
          r.classList.toggle("light", theme === "light");
        } catch (e) {
          // Storage blocked: fall back to the defaults, Arabic and light.
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
